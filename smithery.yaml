# Smithery local stdio server config for the Semesh MCP server.
# Distributed via npm (`npx -y semesh mcp`). No Docker/hosted runtime.
# NOTE: validate against the current Smithery schema (https://smithery.ai/docs) before submitting —
# Smithery's config format evolves. Smithery also auto-ingests servers from the official MCP
# registry, so this file is a faster explicit path, not the only one.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      semeshApiKey:
        type: string
        title: SEMESH_API_KEY
        description: "Your Semesh API key. Optional if you have run `semesh login` and a CLI session is stored."
    required: []
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'semesh', 'mcp'],
      env: config.semeshApiKey ? { SEMESH_API_KEY: config.semeshApiKey } : {}
    })
